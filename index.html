<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O/O ADG(B) - Report Submission Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 100px; }
        input[type="file"] { padding: 5px; background: #fafafa; }
        button { background-color: #0056b3; color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #004085; }
    </style>
</head>
<body>

<div class="container">
    <h2>ADG(B) Office Report Portal</h2>
    
    <!-- enctype="multipart/form-data" is mandatory to allow file attachments -->
    <form action="https://formsubmit.co/theutkal@gmail.com" method="POST" enctype="multipart/form-data">
        
        <!-- Configuration options for FormSubmit -->
        <input type="hidden" name="_subject" value="New Report & PDF Attached from ADG(B) Portal">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">

        <div class="form-group">
            <label for="SubOffice">Select Sub-Office:</label>
            <select id="SubOffice" name="SubOffice" required>
                <option value="">-- Choose Sub-Office --</option>
                <option value="CE(B)">CE(B)</option>
                <option value="CE(HAL)">CE(HAL)</option>
                <option value="SE&PD">SE&PD</option>
                <option value="SE(Mysore)">SE(Mysore)</option>
                <option value="SE(Hubli)">SE(Hubli)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ReportTitle">Report Title / Subject:</label>
            <input type="text" id="ReportTitle" name="ReportTitle" placeholder="Enter brief title of report" required>
        </div>

        <div class="form-group">
            <label for="ReportDetails">Report Description / Details:</label>
            <textarea id="ReportDetails" name="ReportDetails" placeholder="Type or paste summary details here..." required></textarea>
        </div>

        <div class="form-group">
            <label for="reportFile">Upload Report (PDF only):</label>
            <!-- accept=".pdf" ensures users can only select PDF files -->
            <input type="file" id="reportFile" name="reportFile" accept=".pdf" required>
        </div>

        <div class="form-group">
            <label for="SubmittedBy">Submitted By (Name & Designation):</label>
            <input type="text" id="SubmittedBy" name="SubmittedBy" placeholder="Your Name" required>
        </div>

        <button type="submit">Submit Report & PDF</button>
    </form>
</div>

</body>
</html>
